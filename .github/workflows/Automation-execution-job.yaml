name: Automation Execution Pipeline

on:
  schedule:
    # Runs daily at 10:50 PM IST (17:20 UTC)
    - cron: '20 20 * * *'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Selenium Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Check Chrome Version
        run: google-chrome --version

      - name: Run Maven Tests
        run: mvn clean test -Dgroups=mobile -Dtest=TestRunner -Dheadless=true
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz | tar -xz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure generate allure-results --clean -o allure-report

      # Deploy report to GitHub Pages (skipped on PR to prevent overwriting production reports)
      - name: Deploy to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Archive Allure Results and Screenshots
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: execution-artifacts
          path: |
            allure-results/
            allure-report/
            target/screenshots/
            test-output/
          retention-days: 14

      - name: Archive Surefire Reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # Send Email with direct live report link
      - name: Send Test Results via Email
        if: always() && github.event_name != 'pull_request'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Automation Test Execution Report - ${{ github.ref_name }} (Build #${{ github.run_number }})"
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: "Automation CI <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hi Team,

            The scheduled automation run has completed.
            
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Run Number: #${{ github.run_number }}
            - Triggered By: ${{ github.event_name }}
            
            View the live Allure Report here:
            https://${{ github.repository_owner }}.github.io/TestAutomationUI-Flipkart/
            
            GitHub Actions Summary:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Regards,
            QA Automation Team
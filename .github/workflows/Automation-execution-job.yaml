name: Automation Execution Pipeline

on:
  schedule:
    # Runs daily at 10:50 PM IST (17:20 UTC)
    - cron: '20 20 * * *'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  test:
    name: Run Selenium Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Step 3: Verify Google Chrome installation
      - name: Check Chrome Version
        run: google-chrome --version

      # Step 4: Run Cucumber Tests via Maven
      - name: Run Maven Tests
        run: mvn clean test -Dgroups=mobile -Dtest=TestRunner -Dheadless=true
        continue-on-error: true

      # Step 5: Install Allure CLI & Generate Report
      - name: Generate Allure Report
        if: always()
        run: |
          # Download and unpack Allure binary (avoids dpkg apt dependencies)
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz | tar -xz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

          # Generate report from root allure-results directory
          allure generate allure-results --clean -o allure-report

          # Zip the report for email attachment
          sudo apt-get install -y zip
          zip -r allure-report.zip allure-report/

      # Step 6: Send Email with Allure Report Attachment
      - name: Send Test Results via Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Automation Test Execution Report - ${{ github.ref_name }} (Build #${{ github.run_number }})"
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: "Automation CI <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hi Team,

            The scheduled daily automation run has completed.
            
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Run Number: #${{ github.run_number }}
            - Triggered By: ${{ github.event_name }}
            
            Please find the attached Allure Report archive (allure-report.zip).
            
            Regards,
            QA Automation Team
          attachments: allure-report.zip

      # Step 7: Upload Surefire Test Execution Reports
      - name: Archive Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # Step 8: Upload Allure Results & Test Artifacts to GitHub Artifacts
      - name: Archive Allure Results and Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-artifacts
          path: |
            allure-results/
            allure-report/
            target/screenshots/
            test-output/
          retention-days: 14
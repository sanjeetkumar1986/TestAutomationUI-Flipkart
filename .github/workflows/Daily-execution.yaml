name: Flipkart Automation Daily Execution Pipeline
on:
  schedule:
    # Runs daily at 8:30 PM IST (15:00 UTC)
    - cron: '10 17 * * *'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  test:
    name: Run Selenium Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Step 3: Verify Google Chrome installation
      - name: Check Chrome Version
        run: google-chrome --version

      # Step 4: Run Cucumber Tests via Maven
      # Executes TestRunner with headless flag passed to BrowserDriver
      - name: Run Maven Tests
        run: mvn clean test -Dgroups=mobile -Dtest=TestRunner -Dheadless=true
        continue-on-error: true

      # Step 5: Upload Surefire Test Execution Reports
      - name: Archive Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # Step 6: Upload Allure Results & Test Artifacts
      # Pointed directly to the root allure-results directory from your project
      - name: Archive Allure Results and Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-artifacts
          path: |
            allure-results/
            target/screenshots/
            test-output/
          retention-days: 14